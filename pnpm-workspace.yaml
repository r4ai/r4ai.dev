minimumReleaseAge: 4320
trustPolicy: no-downgrade
# Legacy transitive versions already present on main; npm SHA-512 integrity
# verified against the existing lockfile. Keep exceptions version-specific.
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1
  - undici-types@6.21.0
blockExoticSubdeps: true
strictDepBuilds: true

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lefthook: true
  sharp: true
