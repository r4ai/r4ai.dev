minimumReleaseAge: 4320
trustPolicy: no-downgrade
# Legacy transitive versions already present on main; npm SHA-512 integrity
# verified against the existing lockfile. Keep exceptions version-specific.
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1
blockExoticSubdeps: true
strictDepBuilds: true

overrides:
  # Satori pins an older fflate; use the patched release from the same minor line.
  "satori@0.33.4>fflate": "0.7.5"
  # Keep Markdown's generated classes aligned with the directly imported CSS.
  "rehype-katex@7.0.1>katex": "$katex"
  # This version uses Vitest only for its own tests, not its published runtime.
  "vitest-matchmedia-mock@2.0.3>vitest": "-"

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lefthook: true
  sharp: true
