minimumReleaseAge: 4320
trustPolicy: no-downgrade
# Legacy transitive versions already present on main; npm SHA-512 integrity
# verified against the existing lockfile. Keep exceptions version-specific.
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1
blockExoticSubdeps: true
strictDepBuilds: true
# Install peer choices explicitly, including Astro's ESLint 10-compatible A11Y fork.
autoInstallPeers: false

overrides:
  # Keep Satori on the maintained fflate release line.
  "satori@0.33.5>fflate": "0.8.3"
  # Keep Markdown's generated classes aligned with the directly imported CSS.
  "rehype-katex@7.0.1>katex": "$katex"

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lefthook: true
  sharp: true
